[pytest]
; NFR-10: harness de tests antes del rewrite de VAD/servidor. `pythonpath` deja que los tests
; importen igual que el código de producción (`from audio.microphone import ...`, sin prefijo
; `src.`) sin necesitar paquetes __init__.py ni instalar el proyecto.
pythonpath = src
testpaths = src
python_files = test_*.py
; Los artefactos PyInstaller contienen archivos `torch/**/test_*.py`; nunca son parte del
; harness del proyecto. `dist.previous` era la ubicacion historica del rollback y `dist/` es la
; nueva ubicacion ignorada usada por build_exe.ps1.
norecursedirs = build dist dist.previous
